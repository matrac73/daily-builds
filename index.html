<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A four-floor elevator simulator driven by a first-in, first-out call queue." />
    <title>Elevator</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <header class="page-header">
      <h1>Elevator</h1>
      <p>
        Call the car from any floor, then pick a destination on the control panel. Calls are served
        strictly in the order they were made.
      </p>
    </header>

    <main class="layout">
      <section class="building" aria-label="Building cross section">
        <div class="roof" aria-hidden="true"></div>
        <div class="storeys">
          <div class="shaft" aria-hidden="true">
            <div class="car" id="car">
              <div class="door door-left"></div>
              <div class="door door-right"></div>
            </div>
          </div>
          <div class="floors" id="floors"></div>
        </div>
        <div class="ground" aria-hidden="true"></div>
      </section>

      <aside class="side">
        <section class="card panel" aria-labelledby="panel-title">
          <h2 id="panel-title">Control panel</h2>
          <div class="display" aria-hidden="true">
            <span class="display-arrow" id="display-arrow"></span>
            <span class="display-floor" id="display-floor">1</span>
          </div>
          <div class="panel-buttons" id="panel-buttons"></div>
          <div class="countdown" aria-hidden="true"><div class="countdown-bar" id="countdown-bar"></div></div>
          <p class="status" id="status" role="status"></p>
        </section>

        <section class="card" aria-labelledby="queue-title">
          <h2 id="queue-title">Call queue <span class="queue-count" id="queue-count"></span></h2>
          <ol class="queue" id="queue"></ol>
          <p class="warning" id="warning" role="alert" hidden></p>
        </section>

        <section class="card settings" aria-labelledby="settings-title">
          <h2 id="settings-title">Settings</h2>
          <label class="field">
            <span>Seconds between occupants <small>(0 = off)</small></span>
            <input type="number" id="arrival-interval" min="0" max="120" step="1" value="8" inputmode="numeric" />
          </label>
          <label class="field field-inline">
            <input type="checkbox" id="sound-enabled" checked />
            <span>Sound</span>
          </label>
        </section>
      </aside>
    </main>

    <noscript><p class="noscript">This simulator needs JavaScript to run.</p></noscript>
  </body>
</html>
