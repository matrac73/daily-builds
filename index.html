<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Builds · Mathieu Ract</title>
<meta name="description" content="One small app shipped every day by an autonomous coding agent.">
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #d97757; --chip: #21262d;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f8fa; --card: #ffffff; --border: #d0d7de; --text: #1f2328; --muted: #59636e; --chip: #eff2f5; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 56px 16px 72px; }
  h1 { font-size: clamp(2rem, 5vw, 2.8rem); margin: 0 0 8px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .lede { color: var(--muted); max-width: 640px; margin: 0 0 8px; }
  .meta { color: var(--muted); font-size: 0.9rem; margin: 0 0 40px; }
  .meta a { color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .card:hover { border-color: var(--accent); }
  .date { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .card h2 { font-size: 1.1rem; margin: 0; }
  .card p { margin: 0; color: var(--muted); font-size: 0.93rem; flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 0.75rem; }
  .links { display: flex; gap: 16px; font-size: 0.9rem; }
  .links a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .links a:hover { text-decoration: underline; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Daily <span>Builds</span></h1>
  <p class="lede">Every morning an autonomous coding agent (Claude Code) picks an idea, then designs, builds, tests and documents a small app with no human input. This page lists everything it has shipped.</p>
  <p class="meta"><span id="count">…</span> · by <a href="https://github.com/matrac73">Mathieu Ract</a> · <a href="https://github.com/matrac73/daily-builds">source</a></p>
  <div class="grid" id="grid"></div>
</main>
<script type="module">
  const grid = document.getElementById('grid');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  try {
    const projects = (await (await fetch('projects.json', { cache: 'no-store' })).json())
      .sort((a, b) => b.date.localeCompare(a.date));
    document.getElementById('count').textContent = `${projects.length} project${projects.length > 1 ? 's' : ''}`;
    grid.innerHTML = projects.map((p) => `
      <article class="card">
        <div class="date">${esc(p.date)}</div>
        <h2>${esc(p.title)}</h2>
        <p>${esc(p.tagline)}</p>
        <div class="chips">${(p.stack || []).map((s) => `<span class="chip">${esc(s)}</span>`).join('')}</div>
        <div class="links">
          ${p.demo ? `<a href="${esc(p.demo)}">Live demo →</a>` : ''}
          <a href="${esc(p.code)}">Code</a>
        </div>
      </article>`).join('') || '<p class="empty">No project yet.</p>';
  } catch {
    grid.innerHTML = '<p class="empty">Could not load the project list.</p>';
  }
</script>
</body>
</html>
