[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragprod"
version = "1.0.0"
description = "A production-minded RAG over a fictional French document base, powered by an open source LLM, with a KPI-driven spec."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mathieu Ract" }]
requires-python = ">=3.11"
dependencies = ["rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ragprod = "ragprod.cli:main"

[tool.setuptools]
packages = ["ragprod"]

[tool.pytest.ini_options]
testpaths = ["tests"]