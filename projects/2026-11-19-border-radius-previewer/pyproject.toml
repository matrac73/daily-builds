[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radius-preview"
description = "Preview CSS border-radius shapes in the terminal and copy the CSS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mathieu Ract" }]
dependencies = ["rich>=13"]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
radius-preview = "radius_preview.cli:main"

[tool.setuptools]
packages = ["radius_preview"]

[tool.setuptools.dynamic]
version = { attr = "radius_preview.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
