[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-archiver"
version = "1.0.0"
description = "Incrementally archive Slack channels to SQLite before the free-tier limit purges them."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mathieu Ract" }]
requires-python = ">=3.10"
dependencies = ["rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
slack-archiver = "slack_archiver.cli:main"

[tool.setuptools]
packages = ["slack_archiver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
