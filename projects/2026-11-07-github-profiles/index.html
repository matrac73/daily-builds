<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Search any GitHub user and see their profile stats and top repositories." />
    <title>GitHub Profiles</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">GitHub <span>Profiles</span></h1>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle color theme">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>
    </header>

    <main class="container">
      <form id="search-form" class="search" role="search" novalidate>
        <label class="visually-hidden" for="username">GitHub username</label>
        <input
          id="username"
          name="username"
          type="search"
          placeholder="Enter a GitHub username, e.g. torvalds"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          autofocus
        />
        <button type="submit">Search</button>
      </form>

      <p id="alert" class="alert" role="alert" hidden></p>

      <section id="profile" class="profile" aria-live="polite" hidden>
        <div class="card user">
          <img class="avatar" width="120" height="120" alt="" />
          <div class="user-info">
            <h2 class="name"></h2>
            <a class="login" target="_blank" rel="noopener noreferrer"></a>
            <p class="bio"></p>
            <dl class="stats">
              <div><dt>Followers</dt><dd class="followers"></dd></div>
              <div><dt>Following</dt><dd class="following"></dd></div>
              <div><dt>Repositories</dt><dd class="repos"></dd></div>
            </dl>
          </div>
        </div>

        <h3 class="section-title">Top repositories <small>by stars + forks</small></h3>
        <ol class="repo-list"></ol>
        <p class="repo-empty" hidden>This user has no public repositories of their own yet.</p>
      </section>
    </main>

    <footer class="footer">
      Data from the <a href="https://docs.github.com/en/rest" target="_blank" rel="noopener noreferrer">GitHub REST API</a>.
    </footer>

    <template id="repo-template">
      <li class="card repo">
        <a class="repo-name" target="_blank" rel="noopener noreferrer"></a>
        <p class="repo-description"></p>
        <ul class="repo-meta">
          <li><span class="visually-hidden">Language: </span><span class="repo-language"></span></li>
          <li>★ <span class="repo-stars"></span><span class="visually-hidden"> stars</span></li>
          <li>⑂ <span class="repo-forks"></span><span class="visually-hidden"> forks</span></li>
        </ul>
      </li>
    </template>
  </body>
</html>
